name: Dependency Review Vulnerability Check On PR Workflow
on:
  pull_request:
    branches: [dev]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dependency-review:
    name: Dependency Review on PR Job
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Repository Job
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4
      - name: Dependency Review on PR Step
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
